name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t devops-project-web:test .

      - name: Start services with Docker Compose
        run: docker compose up -d --build

      - name: Wait for the database and app to be ready
        run: |
          echo "Waiting for MySQL to be healthy..."
          sleep 20
          echo "Checking app endpoint..."
          curl -f http://localhost:5001 || (docker compose logs && exit 1)

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down