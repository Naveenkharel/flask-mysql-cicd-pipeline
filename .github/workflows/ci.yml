name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services with Docker Compose
        run: docker compose up -d --build

      - name: Wait and test endpoint
        run: |
          sleep 20
          curl -f http://localhost:5001 || (docker compose logs && exit 1)

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down

  publish-and-deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: publish-and-deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Lowercase image name
        id: vars
        run: echo "image=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_LC: ${{ steps.vars.outputs.image }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GH_USER: ${{ github.actor }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: IMAGE_LC,GHCR_PAT,GH_USER,DB_PASSWORD
          script_stop: true
          script: |
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GH_USER" --password-stdin
            docker pull ghcr.io/$IMAGE_LC:latest

            docker network create app-net || true
            docker network connect app-net mysql-db || true

            docker stop web || true
            docker rm web || true
            docker run -d --name web --restart unless-stopped \
              --network app-net \
              -p 80:5001 \
              -e DB_HOST=mysql-db \
              -e DB_USER=root \
              -e DB_PASSWORD="$DB_PASSWORD" \
              -e DB_NAME=devopsdb \
              ghcr.io/$IMAGE_LC:latest

            sleep 10
            docker ps --filter name=web
            docker logs web --tail 30

            
            
#.